name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, json, curl, mbstring, openssl
          coverage: none

      - name: Lint every tracked PHP file with php -l
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              status=1
            fi
          done < <(git ls-files -z -- '*.php')
          exit $status

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, json, curl, mbstring, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            vendor/bin/phpunit
          else
            echo "No phpunit.xml(.dist) found yet, skipping test step."
          fi
